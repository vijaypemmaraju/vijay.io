<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dungeonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dungeon grid -->
  <g transform="translate(100, 40)">
    <!-- room tiles - a mini dungeon map -->
    <!-- row 1 -->
    <rect x="120" y="0" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="160" y="0" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="200" y="0" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>

    <!-- row 2 -->
    <rect x="120" y="40" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.12" stroke-width="0.75"/>
    <rect x="160" y="40" width="40" height="40" fill="#ff6b6b" fill-opacity="0.1" stroke="#ff6b6b" stroke-opacity="0.15" stroke-width="0.75"/>
    <rect x="200" y="40" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.12" stroke-width="0.75"/>
    <rect x="240" y="40" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>

    <!-- row 3 -->
    <rect x="0" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="0.75"/>
    <rect x="40" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="80" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="120" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-opacity="0.12" stroke-width="0.75"/>
    <rect x="160" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-opacity="0.18" stroke-width="0.75"/>
    <rect x="200" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-opacity="0.12" stroke-width="0.75"/>
    <rect x="240" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="280" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="0.75"/>
    <rect x="320" y="80" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="0.75"/>

    <!-- row 4 -->
    <rect x="160" y="120" width="40" height="40" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-opacity="0.12" stroke-width="0.75"/>
    <rect x="200" y="120" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="320" y="120" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="0.75"/>

    <!-- row 5 -->
    <rect x="160" y="160" width="40" height="40" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="0.75"/>
    <rect x="200" y="160" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="0.75"/>
    <rect x="240" y="160" width="40" height="40" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="0.75"/>

    <!-- player character (pixel-style) -->
    <g transform="translate(168, 88)" filter="url(#dungeonGlow)">
      <rect x="4" y="0" width="8" height="4" fill="#ff6b6b" fill-opacity="0.7"/>
      <rect x="2" y="4" width="12" height="4" fill="#ff6b6b" fill-opacity="0.8"/>
      <rect x="0" y="8" width="4" height="4" fill="#ff6b6b" fill-opacity="0.6"/>
      <rect x="6" y="8" width="4" height="8" fill="#ff6b6b" fill-opacity="0.7"/>
      <rect x="12" y="8" width="4" height="4" fill="#ff6b6b" fill-opacity="0.6"/>
      <rect x="2" y="16" width="4" height="4" fill="#ff6b6b" fill-opacity="0.5"/>
      <rect x="10" y="16" width="4" height="4" fill="#ff6b6b" fill-opacity="0.5"/>
    </g>

    <!-- key icon -->
    <g transform="translate(288, 90)">
      <circle cx="6" cy="6" r="4" fill="none" stroke="#ffd93d" stroke-opacity="0.35" stroke-width="1.5"/>
      <line x1="10" y1="6" x2="22" y2="6" stroke="#ffd93d" stroke-opacity="0.35" stroke-width="1.5"/>
      <line x1="18" y1="6" x2="18" y2="10" stroke="#ffd93d" stroke-opacity="0.3" stroke-width="1"/>
      <line x1="22" y1="6" x2="22" y2="10" stroke="#ffd93d" stroke-opacity="0.3" stroke-width="1"/>
    </g>

    <!-- door/exit -->
    <rect x="325" y="126" width="26" height="28" rx="2" fill="none" stroke="#ff6b6b" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="346" cy="140" r="1.5" fill="#ff6b6b" fill-opacity="0.4"/>

    <!-- path dots showing explored route -->
    <circle cx="180" cy="20" r="1.5" fill="#ff6b6b" fill-opacity="0.15"/>
    <circle cx="180" cy="60" r="1.5" fill="#ff6b6b" fill-opacity="0.2"/>
    <circle cx="180" cy="100" r="2" fill="#ff6b6b" fill-opacity="0.4"/>
    <circle cx="140" cy="100" r="1.5" fill="#ff6b6b" fill-opacity="0.15"/>
    <circle cx="100" cy="100" r="1.5" fill="#ff6b6b" fill-opacity="0.12"/>
    <circle cx="60" cy="100" r="1.5" fill="#ff6b6b" fill-opacity="0.1"/>
  </g>

  <!-- puzzle icon bottom right -->
  <g transform="translate(420, 260)" opacity="0.12">
    <rect x="0" y="0" width="24" height="24" rx="2" fill="#ff6b6b"/>
    <rect x="28" y="0" width="24" height="24" rx="2" fill="#ff6b6b"/>
    <rect x="0" y="28" width="24" height="24" rx="2" fill="#ff6b6b"/>
    <rect x="28" y="28" width="24" height="24" rx="2" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
