<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- note cards stacked -->
  <g transform="translate(140, 50)">
    <!-- back card -->
    <rect x="30" y="10" width="280" height="180" rx="8" fill="#6c5ce7" fill-opacity="0.04" stroke="#6c5ce7" stroke-opacity="0.08" stroke-width="0.75" transform="rotate(3, 170, 100)"/>

    <!-- middle card -->
    <rect x="15" y="5" width="280" height="180" rx="8" fill="#6c5ce7" fill-opacity="0.06" stroke="#6c5ce7" stroke-opacity="0.1" stroke-width="0.75" transform="rotate(-1, 155, 95)"/>

    <!-- front card -->
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#0f0d18" stroke="#6c5ce7" stroke-opacity="0.2" stroke-width="1"/>
    <!-- note text lines -->
    <rect x="20" y="24" width="140" height="5" rx="2.5" fill="#6c5ce7" fill-opacity="0.2"/>
    <rect x="20" y="40" width="240" height="3" rx="1.5" fill="#6c5ce7" fill-opacity="0.08"/>
    <rect x="20" y="50" width="200" height="3" rx="1.5" fill="#6c5ce7" fill-opacity="0.08"/>
    <rect x="20" y="60" width="220" height="3" rx="1.5" fill="#6c5ce7" fill-opacity="0.06"/>
    <rect x="20" y="70" width="160" height="3" rx="1.5" fill="#6c5ce7" fill-opacity="0.06"/>
    <!-- tags -->
    <rect x="20" y="92" width="40" height="14" rx="7" fill="#6c5ce7" fill-opacity="0.1" stroke="#6c5ce7" stroke-opacity="0.15" stroke-width="0.5"/>
    <rect x="66" y="92" width="52" height="14" rx="7" fill="#6c5ce7" fill-opacity="0.08" stroke="#6c5ce7" stroke-opacity="0.1" stroke-width="0.5"/>
    <rect x="124" y="92" width="36" height="14" rx="7" fill="#6c5ce7" fill-opacity="0.06" stroke="#6c5ce7" stroke-opacity="0.08" stroke-width="0.5"/>
    <!-- AI sparkle icon -->
    <g transform="translate(240, 140)" filter="url(#purpleGlow)">
      <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#a29bfe" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- vector embedding visualization -->
  <g transform="translate(350, 220)">
    <!-- dimensional axes (abstract) -->
    <line x1="0" y1="0" x2="180" y2="-40" stroke="#6c5ce7" stroke-opacity="0.08" stroke-width="0.75" stroke-dasharray="4,4"/>
    <line x1="0" y1="0" x2="60" y2="120" stroke="#6c5ce7" stroke-opacity="0.08" stroke-width="0.75" stroke-dasharray="4,4"/>
    <line x1="0" y1="0" x2="-140" y2="60" stroke="#6c5ce7" stroke-opacity="0.08" stroke-width="0.75" stroke-dasharray="4,4"/>

    <!-- vector points clustered -->
    <circle cx="40" cy="20" r="4" fill="#6c5ce7" fill-opacity="0.3"/>
    <circle cx="55" cy="10" r="3" fill="#a29bfe" fill-opacity="0.25"/>
    <circle cx="48" cy="35" r="3.5" fill="#6c5ce7" fill-opacity="0.2"/>

    <circle cx="120" cy="-20" r="3.5" fill="#6c5ce7" fill-opacity="0.2"/>
    <circle cx="135" cy="-30" r="3" fill="#a29bfe" fill-opacity="0.15"/>
    <circle cx="110" cy="-10" r="2.5" fill="#6c5ce7" fill-opacity="0.18"/>

    <circle cx="-60" cy="50" r="3" fill="#6c5ce7" fill-opacity="0.15"/>
    <circle cx="-45" cy="40" r="2.5" fill="#a29bfe" fill-opacity="0.12"/>

    <!-- search arrow -->
    <line x1="-20" y1="80" x2="35" y2="28" stroke="#a29bfe" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="35" cy="28" r="12" fill="none" stroke="#a29bfe" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
</svg>
