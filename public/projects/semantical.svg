<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- connection lines -->
  <line x1="300" y1="180" x2="160" y2="100" stroke="#ffd93d" stroke-opacity="0.12" stroke-width="1.5"/>
  <line x1="300" y1="180" x2="440" y2="120" stroke="#ffd93d" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="300" y1="180" x2="200" y2="290" stroke="#ffd93d" stroke-opacity="0.1" stroke-width="1.5"/>
  <line x1="300" y1="180" x2="420" y2="280" stroke="#ffd93d" stroke-opacity="0.12" stroke-width="1.5"/>
  <line x1="300" y1="180" x2="130" y2="210" stroke="#ffd93d" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="300" y1="180" x2="480" y2="220" stroke="#ffd93d" stroke-opacity="0.08" stroke-width="1"/>

  <!-- secondary connections -->
  <line x1="160" y1="100" x2="80" y2="60" stroke="#ffd93d" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="160" y1="100" x2="100" y2="160" stroke="#ffd93d" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="440" y1="120" x2="520" y2="80" stroke="#ffd93d" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="440" y1="120" x2="510" y2="180" stroke="#ffd93d" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="200" y1="290" x2="120" y2="330" stroke="#ffd93d" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="420" y1="280" x2="500" y2="330" stroke="#ffd93d" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="130" y1="210" x2="60" y2="260" stroke="#ffd93d" stroke-opacity="0.05" stroke-width="0.75"/>
  <line x1="480" y1="220" x2="550" y2="260" stroke="#ffd93d" stroke-opacity="0.05" stroke-width="0.75"/>

  <!-- tertiary nodes (smallest) -->
  <circle cx="80" cy="60" r="3" fill="#ffd93d" fill-opacity="0.15"/>
  <circle cx="100" cy="160" r="2.5" fill="#ffd93d" fill-opacity="0.12"/>
  <circle cx="520" cy="80" r="3" fill="#ffd93d" fill-opacity="0.15"/>
  <circle cx="510" cy="180" r="2.5" fill="#ffd93d" fill-opacity="0.12"/>
  <circle cx="120" cy="330" r="2.5" fill="#ffd93d" fill-opacity="0.1"/>
  <circle cx="500" cy="330" r="3" fill="#ffd93d" fill-opacity="0.1"/>
  <circle cx="60" cy="260" r="2" fill="#ffd93d" fill-opacity="0.08"/>
  <circle cx="550" cy="260" r="2" fill="#ffd93d" fill-opacity="0.08"/>

  <!-- secondary nodes -->
  <circle cx="130" cy="210" r="5" fill="#ffd93d" fill-opacity="0.15" stroke="#ffd93d" stroke-opacity="0.1" stroke-width="0.75"/>
  <circle cx="480" cy="220" r="5" fill="#ffd93d" fill-opacity="0.15" stroke="#ffd93d" stroke-opacity="0.1" stroke-width="0.75"/>

  <!-- primary satellite nodes -->
  <circle cx="160" cy="100" r="8" fill="#ffd93d" fill-opacity="0.2" stroke="#ffd93d" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="440" cy="120" r="7" fill="#ffd93d" fill-opacity="0.2" stroke="#ffd93d" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="200" cy="290" r="7" fill="#ffd93d" fill-opacity="0.18" stroke="#ffd93d" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="420" cy="280" r="6" fill="#ffd93d" fill-opacity="0.18" stroke="#ffd93d" stroke-opacity="0.15" stroke-width="1"/>

  <!-- center node (largest) -->
  <circle cx="300" cy="180" r="18" fill="#ffd93d" fill-opacity="0.08" stroke="#ffd93d" stroke-opacity="0.25" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <circle cx="300" cy="180" r="8" fill="url(#nodeGrad)"/>

  <!-- word labels (abstract) -->
  <rect x="278" y="208" width="44" height="5" rx="2.5" fill="#ffd93d" fill-opacity="0.15"/>
  <rect x="140" y="116" width="36" height="4" rx="2" fill="#ffd93d" fill-opacity="0.1"/>
  <rect x="424" y="136" width="32" height="4" rx="2" fill="#ffd93d" fill-opacity="0.1"/>
</svg>
