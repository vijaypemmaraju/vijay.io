<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#44b8a8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#88f0e8" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#4ecdc4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2d9e97" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card 1 - front, tilted -->
  <g transform="translate(180, 40) rotate(-8, 120, 160)">
    <rect x="0" y="0" width="240" height="320" rx="12" fill="#0d1b1a" stroke="#4ecdc4" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="320" rx="12" fill="url(#holo)" opacity="0.15"/>
    <rect x="12" y="12" width="216" height="200" rx="6" fill="#4ecdc4" fill-opacity="0.06" stroke="#4ecdc4" stroke-opacity="0.15" stroke-width="0.75"/>
    <text x="120" y="135" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="#4ecdc4" fill-opacity="0.2">W</text>
    <rect x="16" y="226" width="120" height="6" rx="3" fill="#4ecdc4" fill-opacity="0.15"/>
    <rect x="16" y="240" width="80" height="4" rx="2" fill="#4ecdc4" fill-opacity="0.08"/>
    <circle cx="16" cy="262" r="3" fill="#4ecdc4" fill-opacity="0.3"/>
    <circle cx="26" cy="262" r="3" fill="#4ecdc4" fill-opacity="0.3"/>
    <circle cx="36" cy="262" r="3" fill="#4ecdc4" fill-opacity="0.3"/>
    <circle cx="46" cy="262" r="3" fill="#4ecdc4" fill-opacity="0.2"/>
    <circle cx="56" cy="262" r="3" fill="#4ecdc4" fill-opacity="0.1"/>
    <line x1="0" y1="80" x2="240" y2="60" stroke="#88f0e8" stroke-opacity="0.08" stroke-width="40"/>
    <line x1="0" y1="200" x2="240" y2="170" stroke="#88f0e8" stroke-opacity="0.05" stroke-width="25"/>
  </g>

  <!-- card 2 - behind -->
  <g transform="translate(220, 55) rotate(5, 120, 160)" opacity="0.4">
    <rect x="0" y="0" width="240" height="320" rx="12" fill="#0d1b1a" stroke="#4ecdc4" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="12" y="12" width="216" height="200" rx="6" fill="#4ecdc4" fill-opacity="0.04"/>
    <rect x="16" y="226" width="100" height="6" rx="3" fill="#4ecdc4" fill-opacity="0.1"/>
  </g>

  <!-- sparkles -->
  <circle cx="140" cy="80" r="2" fill="#4ecdc4" opacity="0.6" filter="url(#glow)"/>
  <circle cx="460" cy="120" r="1.5" fill="#88f0e8" opacity="0.4"/>
  <circle cx="100" cy="300" r="1" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="500" cy="280" r="2" fill="#4ecdc4" opacity="0.5" filter="url(#glow)"/>
</svg>
